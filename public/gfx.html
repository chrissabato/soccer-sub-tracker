<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadcast GFX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<!-- Broadcast overlay for OBS / vMix browser sources. Transparent page;
     sized in vw so it scales with the source (built for 1920x1080). Doesn't
     use app.css: no page background, no dark mode. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
:root {
    --home: #1d4ed8;
    --home-text: #ffffff;
    --away: #c62828;
    --away-text: #ffffff;
    --in: #34d27b;
    --out: #ff5a4e;
    --ink: #f4f6f8;
    --ink-dim: #aab2bd;
    --panel-top: #1e242d;
    --panel-bottom: #10141a;
    --font: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: normal;
}
html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
}
.hidden { display: none !important; }
.team-home { --team: var(--home); --team-text: var(--home-text); }
.team-away { --team: var(--away); --team-text: var(--away-text); }

/* Lower third, bottom left. 1em = 1vw (19.2px at 1920 wide). */
.gfx {
    position: fixed;
    left: 4.5vw;
    bottom: 6.5vw;
    min-width: 30vw;
    max-width: 50vw;
    font-size: 1vw;
    color: var(--ink);
    filter: drop-shadow(0 .4em 1em rgba(0, 0, 0, .45));
}

/* Header: team block + "Substitution" strip. */
.gfx-head {
    display: flex;
    align-items: stretch;
    height: 2.6em;
    clip-path: inset(0 100% 0 0);
    transition: clip-path .5s var(--ease) .25s;
}
.gfx-team {
    transition: clip-path .3s var(--ease);
    display: grid;
    align-items: center;
    padding: 0 1.1em 0 .9em;
    background: var(--team);
    color: var(--team-text);
    font-weight: 800;
    font-size: 1.55em;
    letter-spacing: .03em;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 22em;
}
/* Both names share one cell so the block is always as wide as the longer
   one, and nothing beside it shifts when the team changes. */
.gfx-team span { grid-area: 1 / 1; overflow: hidden; text-overflow: ellipsis; }
.team-home .gfx-team-away, .team-away .gfx-team-home { visibility: hidden; }
.gfx-strip {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 1em;
    padding: 0 1em;
    background: #f4f6f8;
    color: #10141a;
}
.gfx-label {
    flex: 1;
    font-weight: 700;
    font-size: 1.15em;
    letter-spacing: .22em;
    text-transform: uppercase;
}
.gfx-clock {
    font-weight: 700;
    font-size: 1.3em;
    font-variant-numeric: tabular-nums;
}
.gfx-dots { display: flex; gap: .35em; }
.gfx-dots i {
    transition: background-color .3s;
    width: .55em;
    height: .55em;
    border-radius: 50%;
    background: rgba(16, 20, 26, .25);
}
.gfx-dots i.on { background: #10141a; }

/* Body: one row per player, team color edge on the left. */
.gfx-body {
    background: linear-gradient(var(--panel-top), var(--panel-bottom));
    border-left: .4em solid var(--team);
    transition: clip-path .45s var(--ease) 0s, border-color .3s;
    clip-path: inset(0 0 100% 0);
}
.gfx-line {
    display: grid;
    grid-template-columns: 3em 4.4em 1fr;
    align-items: center;
    column-gap: 1.1em;
    padding: .5em 1.6em .5em 1em;
    opacity: 0;
    transform: translateX(-1.5em);
    transition: opacity .3s ease, transform .4s var(--ease);
}
.gfx-line + .gfx-line { border-top: 1px solid rgba(255, 255, 255, .08); }
/* Chevrons drawn bigger than their cell, which crops them: fills the row
   height edge to edge (negative margin cancels the row padding). */
.gfx-io {
    position: relative;
    align-self: stretch;
    margin: -.5em 0;
    overflow: hidden;
}
.gfx-io svg {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 4.8em;
    height: 6em;
    fill: none;
    stroke: currentColor;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.io-in .gfx-io { color: var(--in); }
.io-out .gfx-io { color: var(--out); transform: scaleY(-1); }
/* Chevrons light bottom to top (OUT is flipped, so top to bottom). */
.gfx-io polyline { opacity: .2; animation: chevron 1.2s ease-in-out infinite; }
.gfx-io polyline:nth-child(3) { animation-delay: 0s; }
.gfx-io polyline:nth-child(2) { animation-delay: .2s; }
.gfx-io polyline:nth-child(1) { animation-delay: .4s; }
@keyframes chevron {
    0%, 70%, 100% { opacity: .2; }
    30% { opacity: 1; }
}
.gfx-num {
    font-weight: 800;
    font-size: 3em;
    line-height: 1.1;
    text-align: right;
    font-variant-numeric: tabular-nums;
}
.gfx-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    font-size: 2.6em;
    text-transform: uppercase;
    letter-spacing: .01em;
}
.io-out .gfx-num, .io-out .gfx-name { color: var(--ink-dim); font-weight: 600; }

/* In: header wipes right, body drops open, rows slide in one by one.
   Out (no .show): the reverse, faster. */
.gfx.show .gfx-head { clip-path: inset(0 0 0 0); transition-delay: 0s; }
.gfx.show .gfx-body { clip-path: inset(0 0 0 0); transition-delay: .3s, 0s; }
.gfx.show .gfx-line { opacity: 1; transform: none; transition-delay: var(--row-delay, .5s); }
.gfx.show .gfx-line + .gfx-line { transition-delay: calc(var(--row-delay, .5s) + .12s); }
/* Next sub in the same showing: rows slip out, the frame stays up. */
.gfx.show.swap .gfx-line { opacity: 0; transform: translateX(-1.5em); transition-delay: 0s; }
/* ...and on a team change the team block wipes out, recolors while hidden,
   and wipes back in. */
.gfx.show.swap-team .gfx-team { clip-path: inset(0 100% 0 0); }

/* Problems only show on screen when opened with &debug. */
.msg {
    position: fixed;
    top: 1vw;
    left: 1vw;
    margin: 0;
    padding: .5em .8em;
    background: rgba(0, 0, 0, .75);
    color: #fff;
    font: 600 16px/1.3 var(--font);
}
</style>
</head>
<body>
<div id="gfx" class="gfx team-home" aria-live="polite">
  <div class="gfx-head">
    <span class="gfx-team"><span id="gfx-team-home" class="gfx-team-home"></span><span id="gfx-team-away" class="gfx-team-away"></span></span>
    <span class="gfx-strip">
      <span class="gfx-label">Substitution</span>
      <span id="gfx-clock" class="gfx-clock"></span>
      <span id="gfx-dots" class="gfx-dots"></span>
    </span>
  </div>
  <div id="gfx-body" class="gfx-body"></div>
</div>
<p id="msg" class="msg hidden"></p>
<script type="module" src="js/gfx.js"></script>
</body>
</html>
