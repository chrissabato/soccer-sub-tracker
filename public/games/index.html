<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<header class="bar">
  <a class="home-link" href="../start/" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
  <h1>Game log</h1>
</header>
<main>
  <section class="card">
    <p id="summary" class="muted">Loading…</p>
    <p id="error" class="error" role="alert"></p>
    <div class="table-scroll">
      <table class="game-log hidden" id="table">
        <thead><tr><th>Created</th><th>Sport</th><th>Home</th><th>Away</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<footer class="site-footer"><button type="button" class="link" onclick="FeedbackWidget.open()">Send feedback</button></footer>
<script type="module" src="../js/games.js"></script>
<script src="https://feedback.chrissabato.com/widget.js" data-app="soccer-sub-tracker" data-button="false" defer></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
