<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA View</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="pa">
<div class="pa-page">
  <header class="pa-head">
    <a class="home-link" href="start/" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
    <span id="title" class="pa-title">Loading…</span>
    <span class="muted"><span id="status-dot" class="status-dot"></span><span id="status">Connecting</span></span>
  </header>
  <p id="error" class="error pa-error" role="alert"></p>

  <section id="now" class="pa-section pa-now" aria-live="polite">
    <h2 class="pa-label">Now <span id="now-time" class="pa-time"></span></h2>
    <div id="now-subs" class="pa-subs"></div>
    <p id="now-empty" class="pa-empty">No subs yet</p>
    <p id="now-age" class="sub-age hidden"></p>
  </section>

  <section class="pa-section pa-pending">
    <h2 class="pa-label">Pending</h2>
    <div id="pending-subs" class="pa-subs"></div>
    <p id="pending-empty" class="pa-empty">None</p>
  </section>
</div>
<script type="module" src="js/pa.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
