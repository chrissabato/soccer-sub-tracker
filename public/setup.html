<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <a class="home-link" href="start/" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
  <h1 id="title">Game setup</h1>
</header>
<main>
  <section id="gate" class="card hidden"></section>

  <div id="app" class="hidden">
    <section class="card share">
      <div class="share-panel">
        <h2>Press box viewer</h2>
        <p class="muted">Live, read-only view of pending and completed subs.</p>
        <div class="share-actions equal">
          <div class="btn-group link-group">
            <a id="open-view" class="button primary" href="#">Monitor</a>
            <button class="button primary copy-link" type="button" data-target="open-view" aria-label="Copy monitor link" title="Copy monitor link"><svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="icon-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></button>
          </div>
          <div class="btn-group link-group">
            <a id="open-pa" class="button primary" href="#">PA</a>
            <button class="button primary copy-link" type="button" data-target="open-pa" aria-label="Copy PA view link" title="Copy PA view link"><svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="icon-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></button>
          </div>
        </div>
      </div>
      <div class="share-panel share-entry">
        <div id="entry-qr" class="qr" aria-label="QR code that opens sub entry on a phone"></div>
        <div>
          <h2>Sub entry phone</h2>
          <div id="code" class="code">······</div>
          <div class="share-actions">
            <div class="btn-group link-group">
              <a id="open-entry" class="button primary" href="#">Sub entry</a>
              <button class="button primary copy-link" type="button" data-target="open-entry" aria-label="Copy sub entry link" title="Copy sub entry link" disabled><svg class="icon-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="icon-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17l9-10"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Game</h2>
      <div class="game-row">
        <div>
          <label for="division">Sport</label>
          <select id="division">
            <option value="womens">Women</option>
            <option value="mens">Men</option>
          </select>
        </div>
        <div class="team-home">
          <label for="home-name"><span class="team-tag">Home</span> team</label>
          <div class="team-field">
            <input id="home-name" autocomplete="off">
            <input id="home-color" type="color" aria-label="Home team color" title="Home team color">
          </div>
        </div>
        <div class="team-away">
          <label for="away-name"><span class="team-tag">Away</span> team</label>
          <div class="team-field">
            <input id="away-name" autocomplete="off">
            <input id="away-color" type="color" aria-label="Away team color" title="Away team color">
          </div>
        </div>
        <div>
          <label for="sub-order">Sub order</label>
          <select id="sub-order">
            <option value="in">IN first</option>
            <option value="out">OUT first</option>
          </select>
        </div>
      </div>
      <p id="game-status" class="muted" role="status"></p>
    </section>

    <div class="grid-2" id="rosters"></div>
  </div>
</main>

<template id="roster-tpl">
  <section class="card roster">
    <h2><span class="team-tag side-tag"></span> <span class="team-name"></span> roster</h2>
    <p class="saved muted"></p>
    <label>Sidearm roster page URL</label>
    <div class="row">
      <input class="url" type="url" inputmode="url" placeholder="https://…/roster">
      <div class="btn-group">
        <button class="fetch" type="button">Fetch roster</button>
        <a class="button open-roster" target="_blank" rel="noopener" aria-label="Open roster page in a new tab" title="Open roster page in a new tab">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
      </div>
    </div>
    <p class="fetch-status muted" role="status"></p>
    <details class="paste-box">
      <summary>Or paste a list</summary>
      <label>One player per line, e.g. <code>10 Jane Smith</code> or <code>10, Jane Smith</code></label>
      <textarea class="paste" spellcheck="false"></textarea>
      <button class="use-paste" type="button">Use this list</button>
    </details>
    <div class="review hidden">
      <table>
        <thead><tr><th>#</th><th>Name</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="row" style="margin-top:10px">
        <button class="add-row small" type="button">Add player</button>
        <span style="flex:1"></span>
        <button class="discard small" type="button">Discard changes</button>
        <button class="save primary" type="button">Save roster</button>
      </div>
    </div>
  </section>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/scraper-core.js"></script>
<script type="module" src="js/setup.js"></script>
</body>
</html>
