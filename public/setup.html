<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Setup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <h1 id="title">Game setup</h1>
  <nav><a id="nav-entry" href="#">Sub entry</a><a id="nav-view" href="#" target="_blank" rel="noopener">Viewer</a><a href="./">Home</a></nav>
</header>
<main>
  <section id="gate" class="card hidden"></section>

  <div id="app" class="hidden">
    <section class="card share">
      <div class="share-panel">
        <h2>Press box viewer</h2>
        <p class="muted">Live, read-only view of pending and completed subs.</p>
        <div class="share-actions">
          <a id="open-view" class="button primary" href="#" target="_blank" rel="noopener">Open viewer</a>
          <a id="open-pa" class="button" href="#" target="_blank" rel="noopener">Open PA view</a>
          <button id="copy-view" type="button">Copy link</button>
        </div>
      </div>
      <div class="share-panel share-entry">
        <div id="entry-qr" class="qr" aria-label="QR code that opens sub entry on a phone"></div>
        <div>
          <h2>Sub entry phone</h2>
          <p class="muted">Scan to open sub entry, or enter this code at <span id="site-host"></span>:</p>
          <div id="code" class="code">······</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Game</h2>
      <div class="game-row">
        <div>
          <label for="division">Sport</label>
          <select id="division">
            <option value="womens">Women's soccer</option>
            <option value="mens">Men's soccer</option>
          </select>
        </div>
        <div class="team-home">
          <label for="home-name"><span class="team-tag">Home</span> team</label>
          <div class="team-field">
            <input id="home-name" list="schools" autocomplete="off">
            <input id="home-color" type="color" aria-label="Home team color" title="Home team color">
          </div>
        </div>
        <div class="team-away">
          <label for="away-name"><span class="team-tag">Away</span> team</label>
          <div class="team-field">
            <input id="away-name" list="schools" autocomplete="off">
            <input id="away-color" type="color" aria-label="Away team color" title="Away team color">
          </div>
        </div>
        <div>
          <label for="sub-order">Sub order</label>
          <select id="sub-order">
            <option value="in">IN first</option>
            <option value="out">OUT first</option>
          </select>
        </div>
      </div>
      <datalist id="schools"></datalist>
      <p id="game-status" class="muted" role="status"></p>
    </section>

    <div class="grid-2" id="rosters"></div>
  </div>
</main>

<template id="roster-tpl">
  <section class="card roster">
    <h2><span class="team-tag side-tag"></span> <span class="team-name"></span> roster</h2>
    <p class="saved muted"></p>
    <label>Sidearm roster page URL</label>
    <div class="row">
      <input class="url" type="url" inputmode="url" placeholder="https://…/roster">
      <div class="btn-group">
        <button class="fetch" type="button">Fetch roster</button>
        <a class="button open-roster" target="_blank" rel="noopener" aria-label="Open roster page in a new tab" title="Open roster page in a new tab">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
      </div>
    </div>
    <p class="fetch-status muted" role="status"></p>
    <details class="paste-box">
      <summary>Or paste a list</summary>
      <label>One player per line, e.g. <code>10 Jane Smith</code> or <code>10, Jane Smith</code></label>
      <textarea class="paste" spellcheck="false"></textarea>
      <button class="use-paste" type="button">Use this list</button>
    </details>
    <div class="review hidden">
      <table>
        <thead><tr><th>#</th><th>Name</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="row" style="margin-top:10px">
        <button class="add-row small" type="button">Add player</button>
        <span style="flex:1"></span>
        <button class="discard small" type="button">Discard changes</button>
        <button class="save primary" type="button">Save roster</button>
      </div>
    </div>
  </section>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/scraper-core.js"></script>
<script type="module" src="js/setup.js"></script>
</body>
</html>
