<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Sub Tracker</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b6e4f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/theme.js"></script>
</head>
<body>
<header class="bar">
  <a class="home-link" href="../" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
  <h1><a class="brand" href="../"><img class="brand-logo" src="../img/logo.svg" alt="" width="28" height="28">Soccer Sub Tracker</a></h1>
</header>
<main>
  <section class="card">
    <div class="tabs" role="tablist" aria-label="Start">
      <button type="button" role="tab" id="tab-create" aria-controls="panel-create" aria-selected="true">New game</button>
      <button type="button" role="tab" id="tab-join" aria-controls="panel-join" aria-selected="false" tabindex="-1">Enter a game code</button>
    </div>

    <div role="tabpanel" id="panel-create" aria-labelledby="tab-create">
    <form id="create" autocomplete="off">
      <label id="division-label">Sport</label>
      <div class="segmented sport-toggle" role="group" aria-labelledby="division-label">
        <button type="button" data-division="womens" aria-pressed="true">Women's</button>
        <button type="button" data-division="mens" aria-pressed="false">Men's</button>
      </div>
      <input type="hidden" id="division" value="womens">
      <label for="home">Home team</label>
      <input id="home" placeholder="Start typing a school" required>
      <label for="away">Away team</label>
      <input id="away" placeholder="Start typing a school" required>
      <p><button class="primary big" type="submit">Create game</button></p>
      <p id="create-error" class="error" role="alert"></p>
      <p class="muted">You'll get a game code for the sub-entry phone and a viewer link for the press box. Games are deleted 72 hours after they're created.</p>
    </form>
    </div>

    <div role="tabpanel" id="panel-join" aria-labelledby="tab-join" hidden>
    <form id="join" class="row" autocomplete="off">
      <input id="code" name="code" placeholder="ABC234" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Game code" required>
      <button class="primary" type="submit">Go</button>
    </form>
    <p id="join-error" class="error" role="alert"></p>
    </div>
  </section>

  <section id="recent" class="card hidden">
    <h2>Recent games</h2>
    <ul id="recent-list" class="recent-list"></ul>
  </section>
</main>
<footer class="site-footer"><button type="button" class="link" onclick="FeedbackWidget.open()">Send feedback</button></footer>
<script type="module" src="../js/home.js"></script>
<script src="https://feedback.chrissabato.com/widget.js" data-app="soccer-sub-tracker" data-button="false" defer></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
