<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="viewer">
<header class="bar">
  <a class="home-link" href="start/" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
  <h1 id="title">Loading…</h1>
  <span class="muted"><span id="status-dot" class="status-dot"></span><span id="status">Connecting</span></span>
</header>
<main>
  <p id="error" class="error" role="alert"></p>

  <section id="latest" class="latest hidden" aria-live="polite">
    <h2 id="latest-title">Latest sub</h2>
    <div id="latest-subs"></div>
  </section>

  <div class="grid-2">
    <section class="card team-home">
      <h2><span class="team-tag" id="home-name">Home</span> pending</h2>
      <div id="pending-home"></div>
      <p id="pending-home-empty" class="muted">None</p>
    </section>
    <section class="card team-away">
      <h2><span class="team-tag" id="away-name">Away</span> pending</h2>
      <div id="pending-away"></div>
      <p id="pending-away-empty" class="muted">None</p>
    </section>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>All subs</h2>
      <div class="row">
        <button id="print" class="small" type="button" disabled>Print</button>
        <button id="export" class="small" type="button" disabled>Export CSV</button>
      </div>
    </div>
    <table class="log">
      <thead><tr><th>TOD</th><th>Clock</th><th>Team</th><th id="col-a">In</th><th id="col-b">Out</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
    <p id="log-empty" class="muted">No subs yet.</p>
  </section>
</main>
<footer class="site-footer"><button type="button" class="link" onclick="FeedbackWidget.open()">Send feedback</button></footer>
<!-- Filled just before printing; the only thing that prints. -->
<section id="print-sheet" class="print-only" aria-hidden="true"></section>
<script type="module" src="js/view.js"></script>
<script src="https://feedback.chrissabato.com/widget.js" data-app="soccer-sub-tracker" data-button="false" defer></script>
</body>
</html>
